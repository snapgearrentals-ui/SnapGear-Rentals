<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SnapGear Admin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#06152f; --navy2:#0b2348; --blue:#123966; --light:#f4f7fb; --text:#0a1938; --muted:#64748b;
  --border:rgba(10,30,60,.12); --white:#fff;
  --free:#15803d; --free-bg:#e6f6ec;
  --res:#b45309; --res-bg:#fdf0cf;
  --out:#1d4ed8; --out-bg:#dbe7ff;
  --over:#b91c1c; --over-bg:#fde2e2;
  --maint:#475569; --maint-bg:#e2e8f0;
  --ret:#94a3b8; --ret-bg:#eef1f5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;color:var(--text);background:var(--light);line-height:1.5;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Montserrat",sans-serif;line-height:1.2}
:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}

/* buttons */
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;transition:background .15s}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--border)}
.btn.ghost:hover{background:var(--light)}
.btn.danger{background:#fff;color:var(--over);border-color:#f3c0c0}
.btn.danger:hover{background:var(--over-bg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.green{background:var(--free)}
.btn.green:hover{background:#166534}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 80% 20%,rgba(34,79,135,.45),transparent 40%),linear-gradient(135deg,#06152f,#0a2449 60%,#071a37)}
.login-box{background:#fff;border-radius:20px;padding:34px;width:100%;max-width:380px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.login-box img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 10px}
.login-box h1{font-size:22px;text-align:center;margin-bottom:4px}
.login-box .sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:14px}
.login-box .btn{width:100%;padding:13px;margin-top:6px}
.err{color:var(--over);font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.hint{background:var(--light);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:14px}

/* fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d5dde8;border-radius:10px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.top-in{max-width:1280px;margin:auto;padding:0 18px;display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Montserrat",sans-serif;font-weight:800;font-size:14px;white-space:nowrap}
.brand img{width:40px;height:40px;object-fit:contain}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:none;border:none;color:#c9d6ea;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.tab-btn.active{background:#fff;color:var(--navy)}
.logout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.logout:hover{background:rgba(255,255,255,.1)}

main{max-width:1280px;margin:auto;padding:24px 18px 60px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:24px}
.page-head p{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.kpi strong{display:block;font-family:"Montserrat",sans-serif;font-size:28px;margin-top:2px;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--muted)}

/* status pills */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.available{background:var(--free-bg);color:var(--free)}
.pill.reserved{background:var(--res-bg);color:var(--res)}
.pill.out,.pill.rented{background:var(--out-bg);color:var(--out)}
.pill.overdue{background:var(--over-bg);color:var(--over)}
.pill.maint{background:var(--maint-bg);color:var(--maint)}
.pill.returned{background:var(--ret-bg);color:#64748b}
.pill.cancelled{background:#f1f1f1;color:#888;text-decoration:line-through}
.pill.held{background:var(--res-bg);color:var(--res)}
.pill.refunded{background:var(--free-bg);color:var(--free)}
.pill.pending{background:var(--ret-bg);color:#64748b}

/* camera board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cam{background:#fff;border:1px solid var(--border);border-left-width:5px;border-radius:14px;padding:14px}
.cam.available{border-left-color:var(--free)}
.cam.reserved{border-left-color:#d97706}
.cam.out{border-left-color:var(--out)}
.cam.overdue{border-left-color:var(--over)}
.cam.maint{border-left-color:var(--maint)}
.cam h4{font-family:"Montserrat",sans-serif;font-size:14px;margin-bottom:8px}
.cam p{font-size:13px;color:var(--muted);margin-top:8px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;align-items:center}
.list-item:last-child{border-bottom:none}
.list-item small{color:var(--muted);display:block}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* availability checker */
.checker{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.checker .field{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--free-bg);color:var(--free);border:1px solid #bfe5cc;border-radius:99px;padding:6px 8px 6px 12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.chip button{background:var(--free);color:#fff;border:none;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* calendar */
.cal-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff;max-height:78vh}
table.cal{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed}
table.cal th,table.cal td{border-right:1px solid #eef1f5;border-bottom:1px solid #eef1f5;height:44px;text-align:center;font-size:12px;padding:0}
table.cal thead th{position:sticky;top:0;background:#fff;z-index:3;height:46px;font-weight:600;color:var(--muted)}
table.cal thead th b{display:block;font-size:14px;color:var(--text)}
table.cal thead th.today{background:var(--navy);color:#cbd8ee}
table.cal thead th.today b{color:#fff}
table.cal thead th.wknd{background:#f6f8fb}
table.cal th.camname{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0 12px;width:170px;min-width:170px;font-size:13px;font-weight:700;border-right:2px solid var(--border)}
table.cal thead th.camname{z-index:4}
table.cal col.d{width:40px}
td.free{background:var(--free-bg);cursor:pointer}
td.free:hover{background:#c9ecd6}
td.free.today{box-shadow:inset 0 0 0 2px var(--navy)}
td.blk{cursor:pointer;font-weight:700;border-radius:0;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:0}
td.blk.reserved{background:var(--res-bg);color:var(--res);box-shadow:inset 0 0 0 1px #f0cf85}
td.blk.rented{background:var(--out-bg);color:var(--out);box-shadow:inset 0 0 0 1px #aac3f7}
td.blk.returned{background:var(--ret-bg);color:#7b8aa0;font-weight:500}
td.maint{background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 6px,#f1f5f9 6px,#f1f5f9 12px);color:var(--maint)}
tr.countrow th,tr.countrow td{background:#fafbfd;font-weight:700;height:34px}
tr.countrow td.zero{color:var(--over)}
tr.countrow td.some{color:var(--free)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.wk{margin-bottom:14px}
.wk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wk-head h3{font-size:16px;margin-right:auto}
.wk-head .tot{font-size:13px;color:var(--muted)}
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wk-day{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 10px 8px;min-width:0}
.wk-day.today{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.wk-day .dn{font-size:12px;color:var(--muted);font-weight:600}
.wk-day .big{font-family:"Montserrat",sans-serif;font-size:28px;font-weight:800;line-height:1.1;margin:2px 0 0;color:var(--out)}
.wk-day .big.zero{color:#aab4c3}
.wk-day .lab{font-size:11px;color:var(--muted);margin-bottom:6px}
.wk-day ul{list-style:none;margin:0;padding:6px 0 0;border-top:1px solid #eef1f5;font-size:12px}
.wk-day li{display:flex;justify-content:space-between;gap:6px;padding:1px 0}
.wk-day li span:last-child{font-weight:700}
.wk-day .mv{font-size:11px;color:var(--muted);margin-top:6px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h3{min-width:160px;text-align:center;font-size:18px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl td small{display:block;color:var(--muted)}
table.tbl tr:hover td{background:#fafbfd}
.num{text-align:right!important;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{padding:10px 12px;border:1px solid #d5dde8;border-radius:10px;background:#fff}
.filters input{flex:1;min-width:200px}

/* bars */
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--light);border-radius:6px;height:20px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,#123966,#2f5f9a);height:100%;border-radius:6px;min-width:2px}
.bar-row .val{text-align:right;font-weight:700}
.bar-row small{color:var(--muted);font-weight:400}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,10,25,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{font-size:20px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-actions .spacer{flex:1}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;border:1px solid #d5dde8;border-radius:9px;padding:8px 10px;margin:0;cursor:pointer}
.checks label:has(input:checked){background:var(--out-bg);border-color:#aac3f7}
.checks label:has(input:disabled){opacity:.45;cursor:not-allowed}
.checks input{width:auto}
.inline-check{display:flex;gap:8px;align-items:center;font-weight:500!important}
.inline-check input{width:auto}
.warn{background:var(--over-bg);color:var(--over);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.info{background:var(--light);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.link-btn{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:12.5px;font-weight:600}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* contracts */
.ct-layout{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.ct-form{position:sticky;top:78px;margin-bottom:0}
.ct-preview{overflow-x:auto}
.doc{background:#fff;width:794px;max-width:100%;margin:0 auto;padding:44px 50px;border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 40px rgba(3,17,40,.10);font-size:12.5px;line-height:1.55;color:#0a1938}
.doc-head{display:flex;align-items:center;gap:20px;border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:18px}
.doc-head img{width:150px;height:auto;flex-shrink:0}
.doc-head h1{font-size:20px;letter-spacing:.5px}
.doc-head p{color:var(--muted);margin:2px 0 0}
.doc p{margin:0 0 7px}
.doc h4{font-family:"Montserrat",sans-serif;font-size:13px;margin:14px 0 4px}
.doc ul.eq{margin:0 0 9px 22px;font-weight:700}
.doc .clause,.doc .sig{break-inside:avoid;page-break-inside:avoid}
.doc .sig{margin-top:20px}
.doc .sig-row{display:flex;gap:26px;margin-top:34px}
.doc .sig-line{flex:1;border-top:1px solid #0a1938;padding-top:4px;font-size:11.5px;color:var(--muted);position:relative}
.doc .sig-name{position:absolute;left:0;right:0;bottom:100%;margin-bottom:3px;color:#0a1938;font-weight:700;font-size:12.5px}
.doc .doc-foot{margin-top:22px;border-top:1px solid #dde4ee;padding-top:10px;text-align:center;color:var(--muted);font-size:11px}
.bar-row.clickable{cursor:pointer;border-radius:8px;padding:3px 4px;margin-left:-4px;margin-right:-4px}
.bar-row.clickable:hover{background:var(--light)}
.bar-row.clickable.sel{background:var(--light);outline:2px solid var(--navy)}
.month-in{padding:8px 10px;border:1px solid #d5dde8;border-radius:10px;background:#fff}
@media(max-width:1000px){.ct-layout{grid-template-columns:1fr}.ct-form{position:static}.doc{padding:26px 20px}.doc-head{flex-direction:column;align-items:flex-start}.doc .sig-row{flex-direction:column;gap:38px}.doc .sig-line{max-width:none!important}}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important}
  .top,.ct-head,.ct-form,#toast,#modal{display:none!important}
  main{max-width:none!important;padding:0!important;margin:0!important}
  .ct-layout{display:block}
  .ct-preview{overflow:visible}
  .doc{width:100%!important;max-width:none!important;border:0;box-shadow:none;border-radius:0;padding:0;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-head img{width:130px}
}
/* charts */
.chart{position:relative;width:100%}
.chart svg text{font-family:"DM Sans",sans-serif;font-size:11.5px;fill:var(--muted)}
.chart svg text.cur{font-weight:700;fill:var(--text)}
.chart svg text.pk{font-weight:700;font-size:12px;fill:var(--text)}
.legend i.ln{width:16px;height:3px;border-radius:2px;vertical-align:middle}
details.tv{margin-top:12px}
details.tv summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--blue);padding:6px 0}
.tip{position:fixed;z-index:300;background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;font-size:12.5px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:240px}
.tip-t{font-weight:700;margin-bottom:5px;color:#c9d6ea}
.tip-r{display:flex;align-items:center;gap:8px;line-height:1.75}
.tip-r i{width:12px;height:3px;border-radius:2px;flex:none;background:transparent}
.tip-r b{font-size:13px}
.tip-r span{color:#b9c7da}
.rb{display:grid;grid-template-columns:175px 1fr;gap:10px;align-items:center;padding:4px 6px;margin:0 -6px 2px;border-radius:8px}
.rb:hover,.rb:focus-visible{background:var(--light)}
.rb-l{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-t{display:flex;align-items:center;gap:8px;min-width:0}
.rb-t i{display:block;height:18px;border-radius:0 4px 4px 0;flex:none}
.rb-t b{font-size:13px;white-space:nowrap}
.rb:hover .rb-t i{filter:brightness(1.12)}
@media(max-width:620px){.rb{grid-template-columns:112px 1fr}}
/* sync badge */
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sync.ok{background:var(--free-bg);color:var(--free)}
.sync.busy,.sync.warn{background:var(--res-bg);color:var(--res)}
.sync.bad{background:var(--over-bg);color:var(--over)}
.pos,.kpi strong.pos{color:var(--free)}
.neg,.kpi strong.neg{color:var(--over)}
.mini{display:flex;flex-direction:column;gap:3px}
.mini i{display:block;height:7px;border-radius:4px;min-width:2px}
.bar-fill.green{background:linear-gradient(90deg,#15803d,#22a35a)}
.bar-fill.amber{background:linear-gradient(90deg,#b45309,#d97706)}
/* units */
.cam .units{margin-top:8px}
.u{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.u .ul{font-weight:700;min-width:62px}
.u small{flex-basis:100%;color:var(--muted)}
.chip.none{background:var(--light);color:var(--muted);border-color:var(--border);padding:6px 12px}
.checks label.busy{color:var(--over);background:var(--over-bg);border-color:#f3c0c0}
.checks label span{flex:1}
.checks em{font-style:normal;font-size:12px;font-weight:700}
.unit-row{display:grid;grid-template-columns:1fr 100px 140px auto;gap:8px;margin-bottom:8px}
.unit-row input,.unit-row select{padding:10px 12px;border:1px solid #d5dde8;border-radius:10px;background:#fff;width:100%}
table.cal th.camname b{display:block;line-height:1.15;font-size:13px}
table.cal th.camname small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
table.cal tr.grp > *{border-top:2px solid #cfd8e6}
@media(max-width:620px){.unit-row{grid-template-columns:1fr 1fr}.unit-row button{grid-column:1/-1}}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:620px){
  .brand span{display:none}
  .board{grid-template-columns:1fr}
  .row2,.row3,.checks{grid-template-columns:1fr}
  .bar-row{grid-template-columns:100px 1fr 76px}
  .kpi strong{font-size:22px}
  table.cal th.camname{width:104px;min-width:104px;font-size:12px;padding:0 8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <form class="login-box" id="loginForm" autocomplete="on">
    <img src="https://drive.google.com/thumbnail?id=1k8i3iCrQTpYOAkYoSrx1Mrn7AD-lbkgH&sz=w300" alt="" onerror="this.style.display='none'">
    <h1>SnapGear Admin</h1>

const DEFAULT_UNITS = {
  pocket3: ['Unit 1','Unit 2','Unit 3'],
  pocket4: ['Unit 1','Unit 2'],
  xt30: ['Kitlens','35mm lens'],
  goultra: ['Unit 1','Unit 2']
};
function mkUnits(id, labels, status='active'){ return labels.map((l,i) => ({id:`${id}-u${i+1}`, label:l, status})); }

function migrate(d){
  d.cameras.forEach(c => {
    if(!Array.isArray(c.units) || !c.units.length){
      c.units = mkUnits(c.id, DEFAULT_UNITS[c.id] || ['Unit 1'], c.status === 'maintenance' ? 'maintenance' : 'active');
    }
    delete c.status;
  });
  d.bookings.forEach(b => {
    b.cameras = (b.cameras || []).map(id => {
      if(d.cameras.some(c => c.units.some(u => u.id === id))) return id;
      const c = d.cameras.find(c => c.id === id);
      return c ? c.units[0].id : id;
    });
  });
  if(!Array.isArray(d.expenses)) d.expenses = [];
  /* one-time additions of new gear (added once; never re-added if you later remove it) */
  if(!Array.isArray(d.seeded)) d.seeded = [];
  if(!d.seeded.includes('pocket4p')){
    d.seeded.push('pocket4p');
    if(!d.cameras.some(c => c.id === 'pocket4p' || /pocket\s*4\s*p/i.test((c.name || '') + ' ' + (c.short || ''))))
      d.cameras.push({id:'pocket4p', name:'DJI Osmo Pocket 4P', short:'Osmo Pocket 4P', rate3:700, rate4:600, units: mkUnits('pocket4p', ['Unit 1'])});
  }
  return d;
}

async function sha(s){
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sg|' + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(const c of 'sg|' + s) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
  return 'f' + h;
}

/* =========================================================
   BUSINESS LOGIC
========================================================= */
const occ = b => b.status === 'reserved' || b.status === 'rented';
const cam = id => db.cameras.find(c => c.id === id);                  /* model */
function U(id){ for(const c of db.cameras){ const u = c.units.find(x => x.id === id); if(u) return {u, c}; } return null; }
const modelOf = id => { const r = U(id); return r ? r.c : null; };
function uName(id){ const r = U(id); if(!r) return '(deleted)'; return r.c.units.length > 1 ? `${r.c.short} (${r.u.label})` : r.c.short; }
const camName = uName;
const allUnits = () => db.cameras.flatMap(c => c.units.map(u => ({u, c})));

function calcAmount(ids, days){
  days = Math.max(days, 1);
  const parts = {}; let total = 0;
  const models = ids.map(id => (modelOf(id) || {}).id);
  const combo = models.includes('xt30') && models.includes('tamron');      /* website promo */
  ids.forEach(id => {
    const c = modelOf(id); if(!c) return;
    let rate = days >= 4 ? c.rate4 : c.rate3;
    if(combo && c.id === 'tamron') rate = 500;
    parts[id] = rate * days; total += parts[id];
  });
  return {total, parts};
}

function conflictsFor(ids, start, end, ignoreId){
  const out = [];
  ids.forEach(id => {
    const r = U(id); if(!r) return;
    if(r.u.status === 'maintenance') out.push(`${uName(id)} is under maintenance`);
    db.bookings.forEach(b => {
      if(b.id === ignoreId || !occ(b) || !b.cameras.includes(id)) return;
      if(start <= b.end && end >= b.start) out.push(`${uName(id)} is already booked ${fmt(b.start)} – ${fmt(b.end)} (${b.renter})`);
    });
  });
  return out;
}

function unitStatus(id, d){
  const r = U(id);
  if(!r || r.u.status === 'maintenance') return {k:'maint', label:'Maintenance'};
  const bs = db.bookings.filter(b => occ(b) && b.cameras.includes(id));
  const cur = bs.find(b => b.start <= d && b.end >= d);
  if(cur) return {k: cur.status === 'rented' ? 'out' : 'reserved', b:cur, label: cur.status === 'rented' ? 'Out on rental' : 'Reserved'};
  const od = bs.find(b => b.status === 'rented' && b.end < d);
  if(od) return {k:'overdue', b:od, label:'Overdue return'};
  return {k:'available', label:'Available'};
}
function nextBooking(id, d){
  return db.bookings.filter(b => occ(b) && b.cameras.includes(id) && b.start > d).sort((a,b) => a.start.localeCompare(b.start))[0];
}

function revenueOf(b){
  if(b.status === 'rented' || b.status === 'returned') return (Number(b.amount) || 0) + (Number(b.extra) || 0);
  if(b.status === 'cancelled' && b.feePaid) return RES_FEE;
  return 0;
}
function allocate(b){
  const rev = revenueOf(b);
  if(!b.cameras.length) return [];
  if(b.status === 'cancelled') return b.cameras.map(id => [id, rev / b.cameras.length]);
  const {parts} = calcAmount(b.cameras, diff(b.start, b.end));
  const sum = Object.values(parts).reduce((a,x) => a + x, 0);
  return b.cameras.map(id => [id, sum ? rev * (parts[id] || 0) / sum : rev / b.cameras.length]);
}

function unitInfo(s, id, t){
  if(s.k === 'out') return `Back ${fmt(s.b.end)} · ${esc(s.b.renter)}`;
  if(s.k === 'reserved') return `Pickup ${fmt(s.b.start)} · ${esc(s.b.renter)}`;
  if(s.k === 'overdue') return `Was due ${fmt(s.b.end)} · ${esc(s.b.renter)}`;
  if(s.k === 'maint') return 'Not rentable right now';
  const nx = nextBooking(id, t);
  return nx ? `Free until ${fmt(addDays(nx.start,-1))}` : 'No upcoming bookings';
}

function renderDash(){
  const t = today();
  const units = allUnits().map(x => ({...x, s: unitStatus(x.u.id, t)}));
  const nAvail = units.filter(x => x.s.k === 'available').length;
  const nOut = units.filter(x => x.s.k === 'out' || x.s.k === 'overdue').length;
  const ym = t.slice(0,7);
  const monthRev = db.bookings.filter(b => b.start.slice(0,7) === ym).reduce((a,b) => a + revenueOf(b), 0);
  const monthExp = db.expenses.filter(e => e.date.slice(0,7) === ym).reduce((a,e) => a + (Number(e.amount)||0), 0);
  const held = db.bookings.filter(b => b.depositStatus === 'held' && b.status !== 'cancelled').reduce((a,b) => a + (Number(b.deposit)||0), 0);

  const pickups = db.bookings.filter(b => b.status === 'reserved' && b.start <= t).sort((a,b) => a.start.localeCompare(b.start));
  const returns = db.bookings.filter(b => b.status === 'rented' && b.end <= t).sort((a,b) => a.end.localeCompare(b.end));
  const upcoming = db.bookings.filter(b => b.status === 'reserved' && b.start > t).sort((a,b) => a.start.localeCompare(b.start)).slice(0,5);

function runCheck(){

/* =========================================================
   CALENDAR  (one row per physical unit)
========================================================= */
let calM = {y: new Date().getFullYear(), m: new Date().getMonth()};
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
let calW = mondayOf(today());

/* weekly strip: how many units are out on each day of a Mon–Sun week */
function weekStrip(){
  const t = today(), days = [];
  for(let k=0; k<7; k++) days.push(addDays(calW, k));
  let unitDays = 0, ids = new Set();
  const cards = days.map(i => {
    const bs = db.bookings.filter(b => occ(b) && b.start <= i && b.end >= i);
    const perModel = {};
    let n = 0;
    bs.forEach(b => b.cameras.forEach(id => { const c = modelOf(id); if(!c) return; n++; perModel[c.short] = (perModel[c.short] || 0) + 1; }));
    unitDays += n; bs.forEach(b => ids.add(b.id));
    const out = bs.filter(b => b.start === i).length, back = bs.filter(b => b.end === i).length;
    const lis = Object.entries(perModel).map(([k,v]) => `<li><span>${esc(k)}</span><span>×${v}</span></li>`).join('');
    const dow = parse(i).toLocaleDateString('en-PH',{weekday:'short'});
    return `<div class="wk-day ${i === t ? 'today' : ''}"><div class="dn">${dow} · ${fmt(i)}</div>
      <div class="big ${n ? '' : 'zero'}">${n}</div><div class="lab">${n === 1 ? 'camera rented' : 'cameras rented'}</div>
      ${lis ? `<ul>${lis}</ul>` : ''}
      ${(out || back) ? `<div class="mv">${out ? `↗ ${out} pickup${out>1?'s':''}` : ''}${out && back ? ' · ' : ''}${back ? `↙ ${back} return${back>1?'s':''}` : ''}</div>` : ''}</div>`;
  }).join('');
  const isThis = calW === mondayOf(t);
  return `<div class="wk"><div class="wk-head">
    <h3>${isThis ? 'This week' : 'Week'}: ${fmt(calW)} – ${fmt(addDays(calW,6))}</h3>
    <span class="tot">${ids.size} booking${ids.size===1?'':'s'} · ${unitDays} unit-day${unitDays===1?'':'s'}</span>
    <button class="btn ghost sm" data-act="wkPrev">◀</button>
    <button class="btn ghost sm" data-act="wkThis">This week</button>
    <button class="btn ghost sm" data-act="wkNext">▶</button>
  </div><div class="wk-grid">${cards}</div></div>`;
}

function renderCal(){
  const {y,m} = calM;
  const nd = new Date(y, m+1, 0).getDate();
  const last = `${y}-${pad(m+1)}-${pad(nd)}`;
  const t = today();
  const title = new Date(y,m,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'});
  const dayIso = d => `${y}-${pad(m+1)}-${pad(d)}`;

  let head = '<tr><th class="camname">Camera</th>';
  for(let d=1; d<=nd; d++){
    const i = dayIso(d), dow = parse(i).getDay();
    head += `<th class="${i === t ? 'today' : ''} ${dow===0||dow===6 ? 'wknd' : ''}"><b>${d}</b>${'SMTWTFS'[dow]}</th>`;
  }
  head += '</tr>';

  const showB = (id, i) => {
    const hit = db.bookings.filter(b => b.status !== 'cancelled' && b.cameras.includes(id) && b.start <= i && b.end >= i);
    return hit.find(occ) || hit[0];
  };

  let rows = '';
  db.cameras.forEach(c => c.units.forEach((u, ui) => {
    const multi = c.units.length > 1;
    rows += `<tr class="${ui === 0 ? 'grp' : ''}"><th class="camname" title="${esc(c.name)}"><b>${esc(c.short)}</b>${multi ? `<small>${esc(u.label)}</small>` : ''}</th>`;
    for(let d=1; d<=nd;){
      const i = dayIso(d);
      if(u.status === 'maintenance'){ rows += `<td class="maint" title="Under maintenance">${d === 1 ? 'Maintenance' : ''}</td>`; d++; continue; }
      const b = showB(u.id, i);
      if(b){
        const endI = b.end < last ? b.end : last;
        const span = diff(i, endI) + 1;
        const label = span >= 3 ? esc(b.renter) : (span === 2 ? esc(b.renter.split(' ')[0]) : esc(b.renter.charAt(0)));
        rows += `<td colspan="${span}" class="blk ${b.status}" data-act="editBooking" data-id="${b.id}" title="${esc(b.renter)} · ${fmt(b.start)} – ${fmt(b.end)} · ${b.status}">${label}</td>`;
        d += span;
      } else {
        rows += `<td class="free ${i === t ? 'today' : ''}" data-act="calFree" data-cam="${u.id}" data-date="${i}" title="Available ${fmt(i)}. Click to book."></td>`;
        d++;
      }
    }
    rows += '</tr>';
  }));

  let count = '<tr class="countrow"><th class="camname">Free units</th>';
  for(let d=1; d<=nd; d++){
    const i = dayIso(d);
    const n = allUnits().filter(({u}) => u.status !== 'maintenance' && !db.bookings.some(b => occ(b) && b.cameras.includes(u.id) && b.start <= i && b.end >= i)).length;
    count += `<td class="${n === 0 ? 'zero' : 'some'}">${n}</td>`;
  }
  count += '</tr>';

  $('#tab-cal').innerHTML = `
  <div class="page-head">
    <div><h2>Master calendar</h2><p>One row per unit. Green cells are free. Click a free cell to book, or a colored block to edit.</p></div>
    <div class="actions cal-nav">
      <button class="btn ghost sm" data-act="calPrev">◀</button>
      <h3>${title}</h3>
      <button class="btn ghost sm" data-act="calNext">▶</button>
      <button class="btn ghost sm" data-act="calToday">Today</button>
      <button class="btn sm" data-act="newBooking">+ New booking</button>
    </div>
  </div>
  ${weekStrip()}
  <div class="legend">
    <span><i style="background:var(--free-bg);border:1px solid #bfe5cc"></i>Available</span>
    <span><i style="background:var(--res-bg);border:1px solid #f0cf85"></i>Reserved</span>
    <span><i style="background:var(--out-bg);border:1px solid #aac3f7"></i>Rented out</span>
    <span><i style="background:var(--ret-bg)"></i>Returned</span>
    <span><i style="background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 3px,#f1f5f9 3px,#f1f5f9 6px)"></i>Maintenance</span>
  </div>
  <div class="cal-wrap"><table class="cal"><colgroup><col style="width:170px">${'<col class="d">'.repeat(nd)}</colgroup><thead>${head}</thead><tbody>${rows}${count}</tbody></table></div>`;
}

const CHECKS = [['ids','2 valid IDs + selfie'],['bill','Billing statement'],['fb','Facebook connected'],['video','Video verification'],['contract','Agreement signed']];
const balanceDue = b => (Number(b.amount)||0) + (Number(b.extra)||0) + (Number(b.deposit)||0) - (b.feePaid ? RES_FEE : 0);

function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ prompt('Copy this message:', text); }
  ta.remove();
}
function copyText(text, label){
  const done = () => toast(label || 'Message copied. Paste it in Messenger.');
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function reminderText(b){
  const gear = b.cameras.map(camName).join(' + '), t = today(), first = b.renter.trim().split(' ')[0];
  if(b.status === 'rented'){
    const when = b.end < t ? `noong ${fmt(b.end)}` : b.end === t ? 'ngayong araw' : `sa ${fmt(b.end)}`;
    return `Hi ${first}! Friendly reminder po na due na ang return ng ${gear} ${when}. Pakisabi po kung anong oras kayo makakapag-return o kung kailangan ng pick-up. Salamat po! – SnapGear Rentals`;
  }
  return `Hi ${first}! Reminder po sa rental ninyo ng ${gear} (${fmt(b.start)} – ${fmt(b.end)}). Ang babayaran sa rental day ay ${peso(balanceDue(b))}, kasama na ang refundable security deposit. Salamat po! – SnapGear Rentals`;
}

function bfUpdate(){

  const n = boxes.filter(i => i.checked).length;
  boxes.forEach(i => i.disabled = n >= 3 && !i.checked);
  const f = readForm();
  const valid = f.start && f.end && f.end >= f.start;
  const live = f.status === 'reserved' || f.status === 'rented';
  const days = valid ? Math.max(diff(f.start, f.end), 1) : 0;
  $('#f_days').textContent = valid ? `${days} day${days>1?'s':''}` : '—';
  if(!fm.amt && valid) $('#f_amount').value = calcAmount(f.cameras, days).total;
  if(!fm.dep) $('#f_deposit').value = 1000 * f.cameras.length;
  const f2 = readForm();
  $('#f_balance').innerHTML = `${peso(balanceDue(f2))} <small style="color:var(--muted);font-weight:500">includes refundable deposit</small>`;
  document.querySelectorAll('#f_cams label').forEach(l => {
    const busy = valid && live && conflictsFor([l.dataset.u], f.start, f.end, editingId).length > 0;
    l.classList.toggle('busy', busy);
    l.querySelector('em').textContent = busy ? 'taken' : '';
  });
  const w = (valid && f.cameras.length && live) ? conflictsFor(f.cameras, f.start, f.end, editingId) : [];
  $('#f_warn').innerHTML = w.length ? `<div class="warn"><b>Heads up:</b><br>${w.map(esc).join('<br>')}</div>` : '';
}

function saveBooking(){
  const f = readForm();
  if(!f.renter) return toast('Enter the renter name.');
  if(!f.cameras.length) return toast('Pick at least one unit.');
  if(!f.start || !f.end || f.end < f.start) return toast('Check the dates. Return date can’t be before the start date.');
  if(f.status === 'reserved' || f.status === 'rented'){
    const w = conflictsFor(f.cameras, f.start, f.end, editingId);
    if(w.length && !confirm('There are conflicts:\n\n' + w.join('\n') + '\n\nSave anyway?')) return;
  }
  if(f.status === 'rented' && f.depositStatus === 'pending' && f.deposit > 0) f.depositStatus = 'held';
  if(editingId){ const i = db.bookings.findIndex(b => b.id === editingId); db.bookings[i] = {...db.bookings[i], ...f}; }
  else db.bookings.push({id: uid(), ...f, created: today()});
  save(); closeModal(); render(); toast('Booking saved.');
}
function deleteBooking(){
  if(!editingId || !confirm('Delete this booking permanently?')) return;
  db.bookings = db.bookings.filter(b => b.id !== editingId);
  save(); closeModal(); render(); toast('Booking deleted.');
}

/* =========================================================
   SALES
========================================================= */
const EXP_CATS = ['Delivery (Grab/Lalamove)','Repair & maintenance','Equipment purchase','Accessories & supplies','Ads & marketing','Fees & subscriptions','Other'];
const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const shiftMonth = (k, n) => { const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const monthName = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-PH',{month:'long',year:'numeric'});
let salesPeriod = 'month';
let pickedMonth = shiftMonth(monthKey(), -1);
function setPick(k){ if(k >= monthKey()) salesPeriod = 'month'; else { pickedMonth = k; salesPeriod = 'pick'; } renderSales(); }
const pesoS = n => (n < 0 ? '-' : '') + peso(Math.abs(n));
const weekStart = s => { const dow = (parse(s).getDay() + 6) % 7; return addDays(s, -dow); };   /* weeks run Monday to Sunday */
const inR = (d, r) => d >= r.from && d <= r.to;
const isPaid = b => b.status === 'rented' || b.status === 'returned';

function periodRange(p){
  const t = today();
  if(p === 'week'){ const w = weekStart(t); return {from: w, to: addDays(w,6)}; }
  if(p === 'month'){ const [y,m] = t.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return {from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(last)}`}; }
  if(p === 'pick'){ const [y,m] = pickedMonth.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return {from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(last)}`}; }
  if(p === 'last30') return {from: addDays(t,-29), to: t};
  if(p === 'year') return {from: t.slice(0,4) + '-01-01', to: t.slice(0,4) + '-12-31'};
  const dates = [...db.bookings.map(b => b.start), ...db.expenses.map(e => e.date)].sort();
  return {from: dates[0] || t, to: '9999-12-31'};
}
const sumExp = list => list.reduce((a,e) => a + (Number(e.amount) || 0), 0);
const sumRev = list => list.reduce((a,b) => a + revenueOf(b), 0);

function renderSales(){
  const t = today(), r = periodRange(salesPeriod);
  const bks = db.bookings.filter(b => inR(b.start, r));
  const exps = db.expenses.filter(e => inR(e.date, r));
  const counted = bks.filter(isPaid);
  const rev = sumRev(bks), expTotal = sumExp(exps), profit = rev - expTotal;
  const margin = rev ? Math.round(profit / rev * 100) : 0;
  const days = counted.reduce((a,b) => a + Math.max(diff(b.start,b.end),1), 0);
  const pending = bks.filter(b => b.status === 'reserved').reduce((a,b) => a + (Number(b.amount)||0) + (Number(b.extra)||0), 0);

  /* weekly breakdown (Mon–Sun): the weeks of the chosen month, otherwise the last 12 weeks */
  const monthScoped = salesPeriod === 'month' || salesPeriod === 'pick';
  const weeks = [];
  const mkWeek = (f, to, cur) => {
    const wb = db.bookings.filter(b => b.start >= f && b.start <= to);
    const wr = sumRev(wb), we = sumExp(db.expenses.filter(e => e.date >= f && e.date <= to));
    return {f, to, rev: wr, exp: we, profit: wr - we, n: wb.filter(isPaid).length, cur};
  };
  if(monthScoped){
    for(let f = weekStart(r.from); f <= r.to; f = addDays(f, 7)){
      const full = addDays(f, 6);
      weeks.push(mkWeek(f < r.from ? r.from : f, full > r.to ? r.to : full, t >= f && t <= full));
    }
  } else {
    const w0 = weekStart(t);
    for(let i = 11; i >= 0; i--){ const f = addDays(w0, -7*i); weeks.push(mkWeek(f, addDays(f, 6), i === 0)); }
  }
  const thisWeek = weeks[weeks.length - 1];
  const bestWeek = weeks.reduce((a,w) => w.profit > a.profit ? w : a, weeks[0]);
  const avgWeek = weeks.reduce((a,w) => a + w.profit, 0) / weeks.length;
  const maxW = Math.max(...weeks.map(w => Math.max(w.rev, w.exp)), 1);

  /* last 12 months */
  const months = [];
  for(let i = 11; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  const mrows = months.map(k => { const rv = sumRev(db.bookings.filter(b => b.start.slice(0,7) === k)); const ex = sumExp(db.expenses.filter(e => e.date.slice(0,7) === k)); return {k, rv, ex}; });
  const maxM = Math.max(...mrows.map(x => x.rv), 1);

  });
  exps.forEach(e => { if(e.cam && per[e.cam]) per[e.cam].exp += Number(e.amount) || 0; });
  const uTo = r.to < t ? r.to : t, rangeDays = uTo >= r.from ? diff(r.from, uTo) + 1 : 0;
  db.bookings.filter(isPaid).forEach(b => {
    const n = Math.max(diff(b.start,b.end),1), lo = b.start > r.from ? b.start : r.from, endD = addDays(b.start, n-1), hi = endD < uTo ? endD : uTo;
    const od = hi >= lo ? diff(lo, hi) + 1 : 0;
    if(od) b.cameras.forEach(id => { const m = modelOf(id); if(m) per[m.id].occ += od; });
  });
  const perRows = Object.values(per).sort((a,b) => b.rev - a.rev);

  /* payback (all time) */
  const life = {}; db.cameras.forEach(c => life[c.id] = {name: c.short, rev:0, exp:0, cost: c.units.reduce((a,u) => a + (Number(u.cost)||0), 0)});
  db.bookings.forEach(b => allocate(b).forEach(([id,v]) => { const m = modelOf(id); if(m) life[m.id].rev += v; }));
  db.expenses.forEach(e => { if(e.cam && life[e.cam] && e.category !== 'Equipment purchase') life[e.cam].exp += Number(e.amount) || 0; });
  const payRows = Object.values(life).filter(x => x.cost > 0).sort((a,b) => ((b.rev - b.exp) / b.cost) - ((a.rev - a.exp) / a.cost));

  const expList = exps.slice().sort((a,b) => b.date.localeCompare(a.date));
  const periodLabel = salesPeriod === 'pick' ? monthName(pickedMonth) : {week:'this week', month:'this month', last30:'the last 30 days', year:'this year', all:'all time'}[salesPeriod];

  $('#tab-sales').innerHTML = `

    ${monthScoped

      : `<div class="kpi"><small>This week’s profit</small><strong class="${thisWeek.profit < 0 ? 'neg' : 'pos'}">${pesoS(thisWeek.profit)}</strong><span>${fmt(thisWeek.f)} – ${fmt(thisWeek.to)}</span></div>`}

    <div class="kpi"><small>Reserved, not yet released</small><strong>${peso(pending)}</strong><span>expected income</span></div>
    <div class="kpi"><small>Deposits held</small><strong>${peso(db.bookings.filter(b => b.depositStatus === 'held' && b.status !== 'cancelled').reduce((a,b) => a + (Number(b.deposit)||0), 0))}</strong><span>not your income, to be refunded</span></div>

  <div class="card"><h3>Weekly earnings ${monthScoped ? '· ' + periodLabel + ' (Monday to Sunday)' : '(Monday to Sunday, last 12 weeks)'}</h3>

    ${weeks.slice().reverse().map(w => `<tr${w.cur ? ' style="background:#f4f7fb"' : ''}>

    ${expList.map(e => `<tr><td>${fmt(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note || '')}</td><td>${e.cam && cam(e.cam) ? esc(cam(e.cam).short) : '<small>General</small>'}</td><td class="num">${peso(e.amount)}</td><td class="num"><button class="btn sm ghost" data-act="editExpense" data-id="${e.id}">Edit</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">No expenses logged for this period.</div>'}
  </div>`;
  $('#spSel').addEventListener('change', e => { salesPeriod = e.target.value; renderSales(); });
  $('#spMonth').addEventListener('change', e => { if(e.target.value) setPick(e.target.value); });
  chartData = {
    weeks, mrows, selMonth: salesPeriod === 'pick' ? pickedMonth : salesPeriod === 'month' ? monthKey() : null,
    cam: perRows.map(x => ({label: x.name, v: x.rev, tip: [

      {value: x.days, label: 'days rented'}, {value: pesoS(x.rev - x.exp), label: 'net after its expenses'}]})),
    cat: catRows.map(([c, v]) => ({label: c, v, tip: [
      {key: C_EXP, value: peso(v), label: 'spent'}, {value: Math.round(v / (expTotal || 1) * 100) + '%', label: 'of expenses'}]}))

  wireCharts(); drawSalesCharts();
}

/* =========================================================
   SALES CHARTS (plain SVG / HTML, no library)
========================================================= */
const C_REV = '#2a78d6', C_EXP = '#eb6834', C_GRID = '#e6eaf0', C_BASE = '#cfd6e0';
let chartData = null, lastTap = null;

function compactN(n){
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if(a >= 1e6) return s + (a/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if(a >= 1e3) return s + (a/1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/,'') + 'K';
  return s + Math.round(a);
}
const axTick = v => v >= 10000 ? compactN(v) : Math.round(v).toLocaleString('en-PH');
function niceScale(max){
  if(!(max > 0)) return {max: 100, ticks: [0, 50, 100]};
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), res = raw / mag;
  const step = Math.max((res <= 1 ? 1 : res <= 2 ? 2 : res <= 5 ? 5 : 10) * mag, 50);
  const top = Math.ceil(max / step) * step, ticks = [];
  for(let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v));
  return {max: top, ticks};
}
function colPath(x, y, w, h, r){
  r = Math.min(r, w / 2, h);
  return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`;
}
const mlab = (k, i) => { const d = new Date(k + '-01T00:00:00'); return d.toLocaleDateString('en-PH',{month:'short'}) + (i === 0 || d.getMonth() === 0 ? " '" + String(d.getFullYear()).slice(2) : ''); };
const gridSVG = (sc, y, m, W) => sc.ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? C_BASE : C_GRID}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${axTick(v)}</text>`).join('');

/* ----- tooltip (one shared element; text only via textContent) ----- */
function tipShow(e, title, rows){
  const t = $('#chartTip'); if(!t) return;
  t.textContent = '';
  const h = document.createElement('div'); h.className = 'tip-t'; h.textContent = title; t.appendChild(h);
  rows.forEach(r => {
    const d = document.createElement('div'); d.className = 'tip-r';
    const k = document.createElement('i'); if(r.key) k.style.background = r.key; d.appendChild(k);
    const v = document.createElement('b'); v.textContent = String(r.value); d.appendChild(v);
    const l = document.createElement('span'); l.textContent = r.label; d.appendChild(l);
    t.appendChild(d);
  });
  t.hidden = false; tipMove(e);
}
function tipMove(e){
  const t = $('#chartTip'); if(!t) return;
  const pad = 14, vw = window.innerWidth || 1000, vh = window.innerHeight || 800, w = t.offsetWidth || 180, h = t.offsetHeight || 90;
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x + w > vw - 8) x = e.clientX - w - pad;
  if(y + h > vh - 8) y = e.clientY - h - pad;
  t.style.left = Math.max(8, x) + 'px'; t.style.top = Math.max(8, y) + 'px';
}
function tipHide(){ const t = $('#chartTip'); if(t) t.hidden = true; }

/* ----- weekly: grouped columns, revenue vs expenses ----- */
function drawWeekChart(){
  const el = $('#chWeek'); if(!el || !chartData) return;
  const ws = chartData.weeks, W = Math.max(el.clientWidth || 720, 300), H = 250, m = {l: 48, r: 8, t: 22, b: 30};
  const pw = W - m.l - m.r, ph = H - m.t - m.b, top = Math.max(...ws.map(w => Math.max(w.rev, w.exp)));
  const sc = niceScale(top), y = v => m.t + ph - v / sc.max * ph;
  const band = pw / ws.length, bw = Math.min(24, Math.max(6, band * 0.3)), skip = band < 50 ? 2 : 1;
  const peak = ws.reduce((a, w, i) => w.rev > ws[a].rev ? i : a, 0);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${gridSVG(sc, y, m, W)}`;
  s += `<rect id="chHoverW" x="0" y="${m.t}" width="${band}" height="${ph}" fill="#0a1938" opacity="0.06" visibility="hidden" pointer-events="none"/>`;
  ws.forEach((w, i) => {
    const x0 = m.l + band * i, cx = x0 + band / 2;
    if(w.cur) s += `<rect x="${x0}" y="${m.t}" width="${band}" height="${ph}" fill="#f4f7fb"/>`;
    [[w.rev, cx - bw - 1, C_REV], [w.exp, cx + 1, C_EXP]].forEach(([v, x, c]) => {
      if(v > 0) { const h = Math.max(v / sc.max * ph, 2); s += `<path d="${colPath(x, y(0) - h, bw, h, 4)}" fill="${c}"/>`; }
    });
    if(i === peak && w.rev > 0){
      const lx = Math.min(Math.max(cx - bw / 2 - 1, m.l + 18), W - m.r - 18);
      s += `<text class="pk" x="${lx}" y="${y(w.rev) - 6}" text-anchor="middle">₱${compactN(w.rev)}</text>`;
    }
    if(i % skip === 0) s += `<text class="${w.cur ? 'cur' : ''}" x="${cx}" y="${H - 10}" text-anchor="middle">${fmt(w.f)}</text>`;
    s += `<rect data-i="${i}" x="${x0}" y="${m.t}" width="${band}" height="${ph + 26}" fill="transparent"/>`;
  });
  if(!(top > 0)) s += `<text x="${W / 2}" y="${m.t + ph / 2}" text-anchor="middle">No income or expenses in this period</text>`;
  el.innerHTML = s + '</svg>';
}

/* ----- monthly: two lines on one axis ----- */
function drawMonthChart(){
  const el = $('#chMonth'); if(!el || !chartData) return;
  const ms = chartData.mrows, n = ms.length, W = Math.max(el.clientWidth || 720, 300), H = 260, m = {l: 48, r: 14, t: 24, b: 30};
  const pw = W - m.l - m.r, ph = H - m.t - m.b, top = Math.max(...ms.map(x => Math.max(x.rv, x.ex)));
  const sc = niceScale(top), x0 = m.l + 10, dx = (pw - 20) / (n - 1), y = v => m.t + ph - v / sc.max * ph;
  const pr = ms.map((d, i) => [x0 + dx * i, y(d.rv)]), pe = ms.map((d, i) => [x0 + dx * i, y(d.ex)]);
  const path = p => p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const peak = ms.reduce((a, d, i) => d.rv > ms[a].rv ? i : a, 0), si = ms.findIndex(d => d.k === chartData.selMonth), skip = dx < 38 ? 2 : 1;
  chartData.mg = {W, x0, dx, y, n};
  const dot = (p, c, id, hidden) => `<circle ${id ? `id="${id}"` : ''} cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${c}" stroke="#fff" stroke-width="2" ${hidden ? 'visibility="hidden" pointer-events="none"' : ''}/>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${gridSVG(sc, y, m, W)}`;
  s += `<path d="${path(pr)} L${pr[n-1][0].toFixed(1)},${y(0)} L${pr[0][0].toFixed(1)},${y(0)} Z" fill="${C_REV}" opacity="0.1"/>`;
  if(si >= 0) s += `<line x1="${x0 + dx * si}" x2="${x0 + dx * si}" y1="${m.t}" y2="${y(0)}" stroke="#0a1938" opacity="0.25"/>`;
  s += `<path d="${path(pe)}" fill="none" stroke="${C_EXP}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<path d="${path(pr)}" fill="none" stroke="${C_REV}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += dot(pe[n-1], C_EXP) + dot(pr[n-1], C_REV);
  if(si >= 0 && si !== n - 1) s += dot(pe[si], C_EXP) + dot(pr[si], C_REV);
  if(ms[peak].rv > 0){
    const lx = Math.min(Math.max(pr[peak][0], m.l + 18), W - m.r - 18);
    s += `<text class="pk" x="${lx}" y="${pr[peak][1] - 10}" text-anchor="middle">₱${compactN(ms[peak].rv)}</text>`;
  }
  ms.forEach((d, i) => { if(i % skip === 0) s += `<text class="${i === si ? 'cur' : ''}" x="${x0 + dx * i}" y="${H - 10}" text-anchor="middle">${mlab(d.k, i)}</text>`; });
  s += `<line id="chLine" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" stroke="#0a1938" opacity="0.35" visibility="hidden" pointer-events="none"/>`;
  s += dot([0, 0], C_EXP, 'chDotE', true) + dot([0, 0], C_REV, 'chDotR', true);
  if(!(top > 0)) s += `<text x="${W / 2}" y="${m.t + ph / 2}" text-anchor="middle">No income or expenses yet</text>`;
  s += `<rect id="chHit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph + 26}" fill="transparent" style="cursor:pointer"/>`;
  el.innerHTML = s + '</svg>';
}

/* ----- ranked horizontal bars (camera revenue, expense categories) ----- */
function rbarsHTML(rows, color, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  const max = Math.max(...rows.map(r => r.v), 1);
  return rows.map((r, i) => `<div class="rb" tabindex="0" data-i="${i}"><span class="rb-l" title="${esc(r.label)}">${esc(r.label)}</span><span class="rb-t"><i style="width:${r.v > 0 ? Math.max(r.v / max * 76, 1.5) : 0}%;background:${color}"></i><b>${peso(r.v)}</b></span></div>`).join('');
}
function drawSalesCharts(){
  if(!chartData) return;
  drawWeekChart(); drawMonthChart();
  const c = $('#chCam'), k = $('#chCat');
  if(c) c.innerHTML = rbarsHTML(chartData.cam, C_REV, 'No cameras yet.');
  if(k) k.innerHTML = rbarsHTML(chartData.cat, C_EXP, 'No expenses in this period. Use “+ Add expense” to log delivery fees, repairs, SD cards and so on.');
}

function wireCharts(){
  const idxOf = (e, svg) => {
    const g = chartData && chartData.mg; if(!g || !svg) return -1;
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (g.W / (r.width || g.W));
    return Math.max(0, Math.min(g.n - 1, Math.round((px - g.x0) / g.dx)));
  };
  const wk = $('#chWeek');
  if(wk){
    const hideW = () => { const w = wk.querySelector('#chHoverW'); if(w) w.setAttribute('visibility', 'hidden'); tipHide(); };
    const showW = e => {
      const h = e.target.closest && e.target.closest('[data-i]'); if(!h || !chartData) return hideW();
      const w = chartData.weeks[+h.getAttribute('data-i')], wash = wk.querySelector('#chHoverW');
      if(wash){ wash.setAttribute('x', h.getAttribute('x')); wash.setAttribute('visibility', 'visible'); }
      tipShow(e, `${fmt(w.f)} – ${fmt(w.to)}${w.cur ? ' (this week)' : ''}`, [
        {key: C_REV, value: peso(w.rev), label: 'Revenue'}, {key: C_EXP, value: peso(w.exp), label: 'Expenses'},
        {value: pesoS(w.profit), label: 'Profit'}, {value: w.n, label: w.n === 1 ? 'rental' : 'rentals'}]);
    };
    wk.addEventListener('pointermove', showW); wk.addEventListener('pointerdown', showW);
    wk.addEventListener('pointerleave', e => { if(e.pointerType !== 'touch') hideW(); });
  }
  const mo = $('#chMonth');
  if(mo){
    const hideM = () => { ['#chLine', '#chDotR', '#chDotE'].forEach(q => { const n = mo.querySelector(q); if(n) n.setAttribute('visibility', 'hidden'); }); tipHide(); };
    const showM = e => {
      const svg = mo.querySelector('svg'), i = idxOf(e, svg); if(i < 0) return;
      const d = chartData.mrows[i], g = chartData.mg, x = g.x0 + g.dx * i;
      const ln = mo.querySelector('#chLine'), dr = mo.querySelector('#chDotR'), de = mo.querySelector('#chDotE');
      if(ln){ ln.setAttribute('x1', x); ln.setAttribute('x2', x); ln.setAttribute('visibility', 'visible'); }
      if(dr){ dr.setAttribute('cx', x); dr.setAttribute('cy', g.y(d.rv)); dr.setAttribute('visibility', 'visible'); }
      if(de){ de.setAttribute('cx', x); de.setAttribute('cy', g.y(d.ex)); de.setAttribute('visibility', 'visible'); }
      tipShow(e, monthName(d.k) + (d.k === monthKey() ? ' (so far)' : ''), [
        {key: C_REV, value: peso(d.rv), label: 'Revenue'}, {key: C_EXP, value: peso(d.ex), label: 'Expenses'}, {value: pesoS(d.rv - d.ex), label: 'Profit'}]);
    };
    mo.addEventListener('pointermove', showM); mo.addEventListener('pointerdown', showM);
    mo.addEventListener('pointerleave', e => { if(e.pointerType !== 'touch') hideM(); });
    mo.addEventListener('click', e => {
      const i = idxOf(e, mo.querySelector('svg')); if(i < 0) return;
      if(e.pointerType === 'touch' && lastTap !== i){ lastTap = i; return; }   /* touch: first tap shows the numbers, second tap opens the month */
      lastTap = null; tipHide(); setPick(chartData.mrows[i].k);
    });
  }
  const rb = (id, key, tipsKey, extra) => {
    const box = $(id); if(!box) return;
    const show = (e, row) => { if(!row || !chartData) return; const r = chartData[key][+row.getAttribute('data-i')]; if(r) tipShow(e, r.label, r.tip); };
    box.addEventListener('pointermove', e => show(e, e.target.closest && e.target.closest('.rb')));
    box.addEventListener('pointerleave', tipHide);
    box.addEventListener('focusin', e => { const row = e.target.closest && e.target.closest('.rb'); if(row){ const b = row.getBoundingClientRect(); show({clientX: b.left + 24, clientY: b.bottom}, row); } });
    box.addEventListener('focusout', tipHide);
  };
  rb('#chCam', 'cam'); rb('#chCat', 'cat');
}
document.addEventListener('pointerdown', e => { if(!(e.target.closest && e.target.closest('.chart'))) tipHide(); });

function csvDownload(name, rows){
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  download(name, csv, 'text/csv');
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderSet(){
  const loginCard = CLOUD ? `<div class="card"><h3>Admin login</h3>
      <div class="info">Signed in as <b>${esc(cloudEmail)}</b>. Your login is handled by Firebase, so it is secure and works on every device.</div>

    </div>` : `<div class="card"><h3>Admin login</h3>
      <div class="field"><label>Username</label><input id="s_user" value="${esc(db.auth.user)}" autocomplete="off"></div>
      <div class="field"><label>New password</label><input id="s_pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div class="field"><label>Repeat new password</label><input id="s_pw2" type="password" autocomplete="new-password"></div>
      <button class="btn" data-act="savePw">Save login</button>
      <div class="hint">This login only keeps casual visitors out. The page’s code can still be read by anyone who opens it, so don’t reuse an important password. To get real security and sync across devices, set up the cloud option.</div>
    </div>`;
  const dataInfo = CLOUD
    ? 'Your data syncs to the cloud, so your phone and laptop always match. Still download a backup once in a while as a safety net.'
    : 'Your data lives in this browser on this device only. Download a backup regularly, and use it to move to another phone or laptop.';
  $('#tab-set').innerHTML = `
  <div class="page-head"><div><h2>Settings</h2><p>Login, backup and data.</p></div></div>
  <div class="two">
    ${loginCard}
    <div class="card"><h3>Backup and restore</h3>
      <div class="info">${dataInfo}</div>
      <div class="actions" style="margin-bottom:14px">
        <button class="btn" data-act="exportJSON">Download backup</button>
        <button class="btn ghost" data-act="importPick">Restore from backup</button>
        <button class="btn ghost" data-act="mergePick">Merge a backup</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <input type="file" id="mergeFile" accept=".json,application/json" hidden>
      </div>
      <div class="info"><b>Restore</b> replaces everything with the backup. <b>Merge</b> only adds bookings that are missing, so nothing is lost.</div>
      <h3 style="margin-top:20px">Data</h3>
      <div class="actions">
        <button class="btn ghost" data-act="sampleData">Add sample bookings</button>
        <button class="btn danger" data-act="resetAll">Delete all bookings</button>
      </div>
    </div>
  </div>`;
  const readFile = (input, fn) => input.addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.cameras) || !Array.isArray(d.bookings)) throw 0;
        fn(d);
      }catch(err){ toast('That file isn’t a valid SnapGear backup.'); }
    };
    r.readAsText(f); e.target.value = '';
  });
  readFile($('#importFile'), d => {
    if(!confirm('Replace current cameras and bookings with this backup?')) return;
    const m = migrate({cameras: d.cameras, bookings: d.bookings, expenses: d.expenses || []});
    db.cameras = m.cameras; db.bookings = m.bookings; db.expenses = m.expenses; save(); render(); toast('Backup restored.');
  });
  readFile($('#mergeFile'), d => {
    const m = migrate({cameras: d.cameras, bookings: d.bookings});
    const have = new Set(db.bookings.map(b => b.id)); let add = 0;
    m.bookings.forEach(b => { if(!have.has(b.id)){ db.bookings.push(b); add++; } });
    m.cameras.forEach(c => { if(!cam(c.id)) db.cameras.push(c); });
    (d.expenses || []).forEach(x => { if(!db.expenses.some(e => e.id === x.id)) db.expenses.push(x); });
    save(); render(); toast(`Merged ${add} new booking${add === 1 ? '' : 's'}.`);
  });
}
async function savePw(){
  const u = $('#s_user').value.trim(), p = $('#s_pw').value, p2 = $('#s_pw2').value;
  if(!u) return toast('Username can’t be empty.');
  if(p || p2){
    if(p.length < 6) return toast('Use at least 6 characters.');
    if(p !== p2) return toast('Passwords don’t match.');
    db.auth.hash = await sha(p); db.auth.isDefault = false;
  }
  db.auth.user = u; save(); $('#s_pw').value = $('#s_pw2').value = ''; toast('Login updated.');
}

function setSync(text, cls){ const el = $('#sync'); if(!el) return; el.textContent = text; el.className = 'sync ' + cls; }
function authMsg(err){
  const c = err && err.code || '';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)) return 'Wrong email or password.';
  if(c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes, or reset your password.';
  if(c === 'auth/network-request-failed') return 'No internet connection.';
  return 'Could not sign in (' + c + ').';
}
function setLoginBusy(busy, msg){
  $('#loginForm button[type=submit]').disabled = busy;
  if(busy) $('#loginErr').textContent = msg || '';
}
function cacheLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function cloudWrite(){
  setSync('Saving…','busy');
  const payload = JSON.parse(JSON.stringify({cameras: db.cameras, bookings: db.bookings, expenses: db.expenses, seeded: db.seeded, updatedAt: Date.now(), updatedBy: cloudEmail}));
  fbDoc.set(payload).then(() => setSync('Synced','ok')).catch(e => { setSync('Not synced','bad'); toast('Could not save to the cloud (' + (e.code || 'error') + ').'); });
}
function cloudBoot(){
  if(!window.firebase){ $('#loginErr').textContent = 'Could not load Firebase. Check your internet connection and reload.'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  fbDoc = firebase.firestore().collection('snapgear').doc('data');
  document.querySelector('label[for=lu]').textContent = 'Email';
  $('#lu').type = 'email'; $('#lu').placeholder = 'you@example.com';
  $('#loginHint').hidden = true;
  fbAuth.onAuthStateChanged(user => {
    if(user){ cloudEmail = user.email || ''; startSync(); }
    else {
      if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
      cloudFirst = true; $('#app').hidden = true; $('#login').hidden = false; setLoginBusy(false);
    }
  });
}
function startSync(){
  setLoginBusy(true, 'Loading your data…');
  if(cloudUnsub) cloudUnsub();
  cloudUnsub = fbDoc.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return;          /* our own write echoing back */
    const first = cloudFirst;
    if(!snap.exists){
      if(first){ localStorage.setItem(JOINED,'1'); cloudWrite(); }   /* very first time: upload this device's data */
    } else {
      const d = snap.data();
      let extra = [];
      if(first && !localStorage.getItem(JOINED)){
        const have = new Set((d.bookings || []).map(b => b.id));
        extra = db.bookings.filter(b => !have.has(b.id));
      }
      const camsBefore = d.cameras.length; db.cameras = d.cameras; db.bookings = d.bookings || []; db.expenses = d.expenses || []; db.seeded = d.seeded || []; migrate(db);
      if(first) localStorage.setItem(JOINED,'1');
      cacheLocal();
      if(db.cameras.length !== camsBefore) save();      /* a new camera was added by an update: store it in the cloud */
      if(first && extra.length && confirm(`This device has ${extra.length} booking${extra.length === 1 ? '' : 's'} that ${extra.length === 1 ? 'isn’t' : 'aren’t'} in the cloud yet. Add ${extra.length === 1 ? 'it' : 'them'} now?`)){
        db.bookings.push(...extra); save();
      }
    }
    setSync('Synced','ok');
    if(first){ cloudFirst = false; $('#login').hidden = true; $('#app').hidden = false; setLoginBusy(false); showTab('dash'); }
    else render();
  }, err => {
    if(cloudFirst){
      $('#loginErr').textContent = err.code === 'permission-denied'
        ? 'This account is not allowed to open the data. Check your Firestore rules and email.'
        : 'Could not load data (' + (err.code || 'error') + ').';
      setLoginBusy(false, ''); fbAuth.signOut();
    } else setSync('Offline','bad');
  });
}

const fullUnit = id => { const r = U(id); return r ? r.c.name + (r.c.units.length > 1 ? ` (${r.u.label})` : '') : ''; };
const ctUnits = () => [ct.u1, ct.u2, ct.u3].filter((v,i,a) => v && U(v) && a.indexOf(v) === i);
const ctDays = () => (ct.start && ct.end && ct.end >= ct.start) ? Math.max(diff(ct.start, ct.end), 1) : 0;
const ctAuto = () => ctUnits().length && ctDays() ? calcAmount(ctUnits(), ctDays()).total : 0;
const ctFile = () => 'SnapGear Rentals_Terms and Conditions_' + ((ct.name.trim().replace(/[\\\/:*?"<>|]+/g,'').replace(/\s+/g,' ')) || 'Renter Name');

  const opts = sel => allUnits().map(({u}) => `<option value="${u.id}" ${sel === u.id ? 'selected' : ''}>${esc(uName(u.id))}</option>`).join('');
  const fills = db.bookings.filter(b => b.status === 'reserved' || b.status === 'rented').sort((a,b) => a.start.localeCompare(b.start));
  $('#tab-ct').innerHTML = `
  <div class="page-head ct-head">
    <div><h2>Contracts</h2><p>Type the renter’s name, pick the unit or units, and the contract is ready to save as PDF.</p></div>
  </div>
  <div class="ct-layout">
    <div class="card ct-form" id="ctForm">
      ${fills.length ? `<div class="field"><label>Fill from an existing booking (optional)</label>
        <select id="ct_fill"><option value="">Choose a booking…</option>${fills.map(b => `<option value="${b.id}" ${ct.bookingId === b.id ? 'selected' : ''}>${esc(b.renter)} · ${fmt(b.start)} – ${fmt(b.end)} · ${esc(b.cameras.map(camName).join(' + '))}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>Renter name</label><input id="ct_name" value="${esc(ct.name)}" placeholder="Full name" autocomplete="off"></div>
      <div class="field"><label>Unit 1</label><select id="ct_u1"><option value="">Select a unit…</option>${opts(ct.u1)}</select></div>
      <div class="field"><label>Unit 2 (optional)</label><select id="ct_u2"><option value="">None (1 item only)</option>${opts(ct.u2)}</select></div>
      <div class="field"><label>Unit 3 (optional)</label><select id="ct_u3"><option value="">None</option>${opts(ct.u3)}</select></div>
      <div class="row2">
        <div class="field"><label>Start date</label><input type="date" id="ct_start" value="${ct.start}"></div>
        <div class="field"><label>Return date</label><input type="date" id="ct_end" value="${ct.end}"></div>
      </div>
      <div class="info" id="ct_info"></div>
      <div class="row2">
        <div class="field"><label>Rental fee (₱) <button type="button" class="link-btn" id="ct_useauto">use auto</button></label><input type="number" min="0" id="ct_amount" value="${ct.amount}"></div>
        <div class="field"><label>Security deposit (₱)</label><input type="number" min="0" id="ct_deposit" value="${ct.deposit}"></div>
      </div>
      <label class="inline-check" style="margin-bottom:12px"><input type="checkbox" id="ct_disc" ${ct.showDisc ? 'checked' : ''}> Mention the discount in the contract</label>
      <div class="field"><label>Contract date</label><input type="date" id="ct_signed" value="${ct.signed}"></div>
      <div id="ct_warn"></div>
      <div class="info">File name: <b id="ct_file"></b></div>
      <div class="actions" style="margin-top:6px">
        <button class="btn" data-act="ctPrint">Save as PDF</button>
        <button class="btn ghost" data-act="ctJpg">Download JPG</button>
        <button class="btn ghost" data-act="ctReset">Clear</button>
      </div>
      <div class="hint" style="margin-top:12px">In the print window, set the destination to <b>Save as PDF</b>. The file name is filled in for you.</div>
    </div>
    <div class="ct-preview"><div class="doc" id="contractDoc"></div></div>
  </div>`;
  const f = $('#ctForm');
  f.addEventListener('input', ctRead);
  f.addEventListener('change', ctRead);
  $('#ct_useauto').addEventListener('click', () => { ct.amtManual = false; ctSync(true); });

    ct.bookingId = b.id; ct.name = b.renter; ct.u1 = b.cameras[0] || ''; ct.u2 = b.cameras[1] || ''; ct.u3 = b.cameras[2] || '';
    ct.start = b.start; ct.end = b.end; ct.amount = Number(b.amount) || 0; ct.deposit = Number(b.deposit) || 0;
    ct.amtManual = ct.amount !== ctAuto(); ct.depManual = ct.deposit !== 1000 * ctUnits().length;

}
function ctRead(e){
  const g = id => $('#' + id);
  ct.name = g('ct_name').value; ct.u1 = g('ct_u1').value; ct.u2 = g('ct_u2').value; ct.u3 = g('ct_u3').value;
  ct.start = g('ct_start').value; ct.end = g('ct_end').value; ct.signed = g('ct_signed').value; ct.showDisc = g('ct_disc').checked;
  if(e && e.target && e.target.id === 'ct_amount'){ ct.amtManual = true; ct.amount = Number(g('ct_amount').value) || 0; }
  if(e && e.target && e.target.id === 'ct_deposit'){ ct.depManual = true; ct.deposit = Number(g('ct_deposit').value) || 0; }
  ctSync(false);
}
function ctSync(setInputs){
  const ids = ctUnits(), days = ctDays(), auto = ctAuto();
  if(!ct.amtManual) ct.amount = auto;
  if(!ct.depManual) ct.deposit = 1000 * ids.length;
  if(setInputs || !ct.amtManual) $('#ct_amount').value = ct.amount;
  if(setInputs || !ct.depManual) $('#ct_deposit').value = ct.deposit;
  const disc = ct.amtManual ? auto - ct.amount : 0;
  $('#ct_info').innerHTML = days
    ? `<b>${days} day${days > 1 ? 's' : ''}</b> · regular rate <b>${peso(auto)}</b>${disc > 0 ? ` · discount <b>${peso(disc)}</b>` : ct.amtManual && disc < 0 ? ` · <b>${peso(-disc)}</b> above the regular rate` : ''}`
    : 'Pick the start and return dates to see the rental period.';
  const w = [];
  if([ct.u1, ct.u2, ct.u3].filter(Boolean).some((v,i,a) => a.indexOf(v) !== i)) w.push('The same unit is picked more than once.');
  if(ct.start && ct.end && ct.end < ct.start) w.push('The return date is before the start date.');
  if(ids.length && days) conflictsFor(ids, ct.start, ct.end, ct.bookingId).forEach(x => w.push(x + '.'));
  $('#ct_warn').innerHTML = w.length ? `<div class="warn">${w.map(esc).join('<br>')}</div>` : '';
  $('#ct_file').textContent = ctFile();
  $('#contractDoc').innerHTML = contractHTML();
}
function ctCheck(){
  if(!ct.name.trim()){ toast('Enter the renter’s name first.'); return false; }
  if(!ctUnits().length){ toast('Pick at least one unit.'); return false; }
  if(!ctDays()){ toast('Check the dates.'); return false; }
  return true;
}
function ctPrint(){
  if(!ctCheck()) return;
  const old = document.title; document.title = ctFile();
  const restore = () => { document.title = old; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
}
async function ctJpg(){
  if(!ctCheck()) return;
  if(!window.html2canvas) return toast('Image export needs an internet connection. Use Save as PDF instead.');
  try{
    const canvas = await html2canvas($('#contractDoc'), {scale: 2, backgroundColor: '#ffffff', windowWidth: 1000,
      onclone: d => { const el = d.getElementById('contractDoc'); el.style.width = '794px'; el.style.maxWidth = '794px'; el.style.boxShadow = 'none'; }});
    const a = document.createElement('a'); a.download = ctFile() + '.jpg'; a.href = canvas.toDataURL('image/jpeg', 0.95); a.click();
  }catch(e){ toast('Could not create the image. Use Save as PDF instead.'); }
}
function ctReset(){
  Object.assign(ct, {name:'', u1:'', u2:'', u3:'', start: today(), end: addDays(today(),1), signed: today(), amount:0, amtManual:false, deposit:0, depManual:false, showDisc:false, bookingId:null});
  renderContracts();
}

const actions = {
  tab: el => showTab(el.dataset.tab),
  logout: () => { if(CLOUD) fbAuth.signOut().then(() => location.reload()); else { sessionStorage.removeItem(SESSION); location.reload(); } },
  resetPw: () => fbAuth.sendPasswordResetEmail(cloudEmail).then(() => toast('Password reset email sent to ' + cloudEmail)).catch(() => toast('Could not send the reset email.')),
  closeModal,
  newBooking: el => openBooking(null, {cam: el.dataset.cam, start: el.dataset.start, end: el.dataset.end}),
  editBooking: el => openBooking(el.dataset.id),
  saveBooking, delBooking: deleteBooking,
  calPrev: () => { calM.m--; if(calM.m < 0){ calM.m = 11; calM.y--; } renderCal(); },
  calNext: () => { calM.m++; if(calM.m > 11){ calM.m = 0; calM.y++; } renderCal(); },
  wkPrev: () => { calW = addDays(calW,-7); renderCal(); },
  wkNext: () => { calW = addDays(calW,7); renderCal(); },
  wkThis: () => { calW = mondayOf(today()); renderCal(); },
  calToday: () => { calM = {y: new Date().getFullYear(), m: new Date().getMonth()}; renderCal(); },
  calFree: el => openBooking(null, {cam: el.dataset.cam, start: el.dataset.date, end: addDays(el.dataset.date,1)}),
  quickRent: el => { const b = db.bookings.find(x => x.id === el.dataset.id); b.status = 'rented'; if(b.depositStatus === 'pending' && b.deposit > 0) b.depositStatus = 'held'; save(); render(); toast('Marked as rented out.'); },
  quickReturn: el => {
    const b = db.bookings.find(x => x.id === el.dataset.id); b.status = 'returned';
    if(b.depositStatus === 'held' && confirm('Marked as returned. Was the ' + peso(b.deposit) + ' deposit refunded too?')) b.depositStatus = 'refunded';
    save(); render(); toast('Marked as returned.');
  },
  newCam: () => openCam(null), editCam: el => openCam(el.dataset.id), saveCam, delCam,
  addUnit: () => { syncUnits(); editUnits.push({id:null, label:'Unit ' + (editUnits.length + 1), status:'active'}); drawUnits(); },
  rmUnit: el => {
    syncUnits();
    const i = Number(el.dataset.i), u = editUnits[i];
    if(editUnits.length === 1) return toast('A model needs at least one unit.');
    if(u.id && db.bookings.some(b => b.cameras.includes(u.id))) return toast('This unit has bookings. Set it to Maintenance instead.');
    editUnits.splice(i,1); drawUnits();
  },
  exportCSV, exportExpCSV, savePw,
  spPrev: () => setPick(shiftMonth(salesPeriod === 'pick' ? pickedMonth : monthKey(), -1)),
  spNext: () => setPick(shiftMonth(salesPeriod === 'pick' ? pickedMonth : monthKey(), 1)),
  pickMonth: el => setPick(el.dataset.m),
  ctPrint, ctJpg, ctReset,
  newExpense: () => openExpense(null), editExpense: el => openExpense(el.dataset.id), saveExpense, delExpense,
  copyForm: () => copyText(DELIVERY_FORM, 'Delivery form link copied.'),
  copyRecv: el => copyText(receivedText(db.bookings.find(x => x.id === el.dataset.id))),
  copyMsg: el => copyText(reminderText(db.bookings.find(x => x.id === el.dataset.id))),
  exportJSON: () => download('snapgear-backup-' + today() + '.json', JSON.stringify({cameras: db.cameras, bookings: db.bookings, expenses: db.expenses}, null, 2), 'application/json'),
  importPick: () => $('#importFile').click(),
  mergePick: () => $('#mergeFile').click(),
  sampleData,
  resetAll: () => { if(confirm('Delete ALL bookings? This can’t be undone. Download a backup first if unsure.')){ db.bookings = []; save(); render(); toast('All bookings deleted.'); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(el && actions[el.dataset.act]) actions[el.dataset.act](el);
});

boot();
